name: Deploy to EasyPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test suite (emergency only)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          timeout 20m python -m pytest tests/ -v --tb=short -m "not e2e"

  deploy:
    name: Deploy to EasyPanel
    runs-on: ubuntu-latest
    needs: test
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.event_name != 'pull_request'
    steps:
      - name: Trigger EasyPanel deployment
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "::error::EASYPANEL_DEPLOY_URL is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            "$EASYPANEL_DEPLOY_URL"

  health_check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Check if health URL is configured
        id: check_url
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping health check — APP_URL is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for container startup
        if: steps.check_url.outputs.configured == 'true'
        run: sleep 15

      - name: Check application availability
        if: steps.check_url.outputs.configured == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          HEALTH_URL="${APP_URL%/}/api/health/external"
          echo "Checking $HEALTH_URL ..."
          for i in $(seq 1 10); do
            STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
              --connect-timeout 5 --max-time 10 "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "::notice::Application is available (HTTP 200); confirm the deployed revision in EasyPanel."
              exit 0
            fi
            echo "Attempt $i/10: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 10 attempts."
          exit 1
