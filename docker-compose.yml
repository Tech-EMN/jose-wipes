services:
  # Web server: FastAPI + frontend. Does NOT process jobs.
  jose-wipes-web:
    build: .
    container_name: jose-wipes-web
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      JW_SKIP_WORKER: "true"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./assets:/app/assets
      - ./credentials:/app/credentials:ro
    restart: always
    command: uvicorn webapp.main:app --host 0.0.0.0 --port ${PORT:-8000}

  # Background worker: polls shared volume for new jobs and processes them.
  jose-wipes-worker:
    build: .
    container_name: jose-wipes-worker
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./assets:/app/assets
      - ./credentials:/app/credentials:ro
    restart: always
    command: python -m webapp.worker
    environment:
      JW_WORKER_POLL_INTERVAL: ${JW_WORKER_POLL_INTERVAL:-2}
      JW_WORKER_GRACE: ${JW_WORKER_GRACE:-30}
