services:
  # Web server: FastAPI + frontend behind Traefik. Does NOT process jobs.
  jose-wipes-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HF_API_KEY: ${HF_API_KEY}
      HF_API_SECRET: ${HF_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_PLANNER_MODEL: ${OPENAI_PLANNER_MODEL:?OPENAI_PLANNER_MODEL must be set}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      JW_API_KEY: ${JW_API_KEY:-}
      JW_AUTH_STRICT: ${JW_AUTH_STRICT:-false}
      JW_RATE_LIMIT_JOBS: ${JW_RATE_LIMIT_JOBS:-5}
      JW_RATE_LIMIT_WINDOW_SECONDS: ${JW_RATE_LIMIT_WINDOW_SECONDS:-60}
      JW_MODERATION_ENABLED: ${JW_MODERATION_ENABLED:-true}
      JW_MODERATION_OPENAI: ${JW_MODERATION_OPENAI:-true}
      JW_MODERATION_STRICT: ${JW_MODERATION_STRICT:-false}
      TZ: ${TZ:-America/Sao_Paulo}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      PORT: "8000"
      JW_SKIP_WORKER: "true"
    volumes:
      - jose_wipes_output:/app/output
      - jose_wipes_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.services.jose-wipes.loadbalancer.server.port=8000
      - traefik.http.routers.jose-wipes-http.rule=Host(`${TRAEFIK_HOST:-studio.seudominio.com}`)
      - traefik.http.routers.jose-wipes-http.entrypoints=web
      - traefik.http.routers.jose-wipes-http.middlewares=jose-wipes-https-redirect
      - traefik.http.middlewares.jose-wipes-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.jose-wipes.rule=Host(`${TRAEFIK_HOST:-studio.seudominio.com}`)
      - traefik.http.routers.jose-wipes.entrypoints=websecure
      - traefik.http.routers.jose-wipes.tls=true
      - traefik.http.routers.jose-wipes.tls.certresolver=letsencrypt
      - traefik.http.routers.jose-wipes.middlewares=jose-wipes-auth
      - traefik.http.middlewares.jose-wipes-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS:-disabled:$$apr1$$9dYh3W41$$m2r7JQYfG6L4lU8m1Kx8U1}

  # Background worker: polls shared volume for new jobs.
  jose-wipes-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m webapp.worker
    environment:
      HF_API_KEY: ${HF_API_KEY}
      HF_API_SECRET: ${HF_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_PLANNER_MODEL: ${OPENAI_PLANNER_MODEL:?OPENAI_PLANNER_MODEL must be set}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/credentials/service-account.json
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      JW_DRIVE_REQUIRED: ${JW_DRIVE_REQUIRED:-false}
      TZ: ${TZ:-America/Sao_Paulo}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      JW_WORKER_POLL_INTERVAL: ${JW_WORKER_POLL_INTERVAL:-2}
      JW_WORKER_GRACE: ${JW_WORKER_GRACE:-30}
      JW_FFMPEG_TIMEOUT: ${JW_FFMPEG_TIMEOUT:-300}
      JW_HIGGSFIELD_POLL_INTERVAL_SECONDS: ${JW_HIGGSFIELD_POLL_INTERVAL_SECONDS:-5}
      JW_HIGGSFIELD_POLL_TIMEOUT_SECONDS: ${JW_HIGGSFIELD_POLL_TIMEOUT_SECONDS:-360}
      JW_HIGGSFIELD_READ_RETRIES: ${JW_HIGGSFIELD_READ_RETRIES:-5}
      JW_HIGGSFIELD_CREDIT_BLOCK_SECONDS: ${JW_HIGGSFIELD_CREDIT_BLOCK_SECONDS:-1800}
      JW_EXTERNAL_HEALTH_CACHE_SECONDS: ${JW_EXTERNAL_HEALTH_CACHE_SECONDS:-300}
    volumes:
      - jose_wipes_output:/app/output
      - jose_wipes_logs:/app/logs
      - "${GOOGLE_SERVICE_ACCOUNT_HOST_PATH:-/dev/null}:/app/credentials/service-account.json:ro"

networks:
  traefik-proxy:
    external: true

volumes:
  jose_wipes_output:
    name: jose_wipes_output
  jose_wipes_logs:
    name: jose_wipes_logs
